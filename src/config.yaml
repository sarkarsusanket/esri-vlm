# ---- Weights & Biases tracking (losses, GPU util/mem, CPU/RAM, lr, throughput, hparams)
use_wandb: true
wandb_project: "esri-vlm"
wandb_entity: null            # set your W&B team/user if needed
wandb_tags:  "dinov2,qwen30.6,siglip,MRL,relationalloss,multilingual,regionloss,keywordloss"              # e.g. "mrl,dinov2,siglip"
wandb_offline: false          # true -> log locally, sync later with `wandb sync`
wandb_every_n_steps: 100       # sampling cadence for GPU/CPU/RAM metrics

# ---- checkpoints
ckpt_path: null                # exact resume: restores weights + optimizer + scheduler + epoch/step
                               # e.g. /path/to/lightning_logs/version_0/checkpoints/last.ckpt
init_ckpt_path: null           # warm start / "starter": loads ONLY model weights, fresh optimizer,
                               # scheduler and epoch (use this to fine-tune from another run)

model:
  # ---- pretrained towers (embeddings are just projected into the shared space)
  text_model_name: "Qwen/Qwen3-Embedding-0.6B"
  image_model_name: "dinov2_vits14"     # loaded from facebookresearch/dinov2 via torch.hub
  text_pooling: "last_eos"              # last_eos | bos | mean
  freeze_text_tower: true               # false -> fine-tune the Qwen backbone too
  freeze_image_tower: true              # false -> fine-tune the DINOv2 backbone too
  precomputed_image: true               # true -> feed precomputed DINOv2 .npy embs (image-xx/ dirs);
                                        # no DINOv2 backbone is loaded, no image bytes are decoded
  precomputed_text: true                # true -> feed precomputed Qwen EOS .npy embs (caption-xx/{summary,
                                        # translated_col,dense_caption,cf_dense_caption}/); keywords and
                                        # regions use keyword_eos/ (summed individual keyword states)
  # ---- projected embedding space
  embed_dim: 256
  projection_type: mlp  # linear_probe | mlp | transformer
                                 # mlp: LayerNorm -> W_in -> residual W2 GELU(W1 h) -> LayerNorm
                                 # transformer: LayerNorm -> W_in -> TransformerEncoder -> LayerNorm
                                 # image and text heads have independent weights
  projection_dropout: 0.0        # mlp / transformer
  projection_num_layers: 1       # transformer only
  projection_num_heads: 8        # transformer only; must divide embed_dim
  projection_ff_dim: 1024        # transformer only; <=0 -> 4 * embed_dim
  image_resolution: 224        # also forwarded to the datamodule
  vision_patch_size: 14        # DINOv2 ViT-S/14 (mask grid = 224 / 14 = 16)
  context_length: 256
  learning_rate: 5e-4
  weight_decay: 0.1
  warmup_steps: 2000
  tokenizer_name: "Qwen/Qwen3-Embedding-0.6B"

  # ---- losses
  loss_type: siglip              # clip | siglip   (siglip: scale=log 10, learnable bias=-10)
  use_mrl: true                 # Matryoshka Representation Learning: also apply the contrastive
                                 # losses on every nested prefix; geometry losses (uniform /
                                 # silhouette / relational) run once at full width only
  mrl_dims: [64, 128, 256]       # nested widths; the full embed_dim (256) is always included last
  use_masks: true             # true -> load masks + region-level loss; false -> nothing mask-related runs
  use_hard_negatives: true     # dense hard negatives: precomputed cf sentences when precomputed_text,
                               # rule-based mutations otherwise (needs w_dense > 0)
  use_keywords: true           # positive keyword combinations + absent/swapped-keyword negatives;
                                # combinations are sums of precomputed individual keyword EOS states
  w_global: 1.0                # summary caption  <-> image CLS
  w_translated: 0.8            # translated summary (caption-xx/translated_col/) <-> image CLS;
                               # only ~30% of the rows have one, hence the lower weight; 0 disables
  w_translated_consistency: 0.5 # mean over translations of 1 - cos(English summary, translated
                               # summary); keeps each language aligned with its English source
  w_dense: 1.0                 # each dense sentence <-> its image (+ hard negatives); 0 disables
  w_dense_cap: 1.0             # whole dense caption <-> image (GCL); 0 disables
  w_dense_cap_cf: 1.0          # whole dense paragraph (pos) vs. whole counterfactual paragraph (neg)
                               # <-> image; needs precomputed cf states (precomputed_text); 0 disables
  w_region: 1.0                # masked patches <-> keyword text; only used if use_masks
  # counterfactual margin loss (dense sentences + keywords)
  w_counter: 1.0
  counter_margin: 0.5          # m in  m * (1 - s(a+, a-))
  counter_tau: 0.1             # temperature dividing the softplus argument
  # threshold (hinge-squared) loss on positive / negative similarities
  w_threshold: 1.0
  threshold_pos: 0.8           # t+ : positives are pulled above this
  threshold_neg: 0.7           # t- : negatives are pushed below this
  # geometry regularisers
  w_uniform: 0.8
  w_silhouette: 0.5
  w_relational: 0.8            # (1/B) sum_i [cos_pre(i,j) - cos_post(i,j)] on precomputed
                               # image CLS + caption EOS states; 0 disables
  relational_pairing: perm     # how j is chosen: perm | shift | all
  relational_squared: true    # true -> mean((cos_pre - cos_post)^2) (structure matching)
  region_min_coverage: 0.1     # a patch counts for a region if >= 10% of it is inside the mask
  text_cache_size: 50000       # LRU cache of frozen Qwen pooled states for repeated on-the-fly
                               # text; unused when precomputed_text=true; 0 disables

data:
  data_dir: "/data/susanket/vlm/images3"   # image-xx.parquet, image-xx/<stem>.npy (DINOv2 embs),
                                          # caption-xx.parquet, masks/, keyword_eos/
  image_col: "image_bytes"   # only read when precomputed_image is false
  batch_size: 1024
  num_workers: 30
  val_fraction: 0.1
  split_seed: 0
  # dense captions / hard negatives
  dense_max_sentences: 5
  hard_neg_per_image: 4        # sentences per image that get a negative twin (the cf_dense_caption
                               # row when precomputed_text, a mutated sentence otherwise)
  hard_neg_mut_count: 1        # edits per mutated sentence (only when text embs are not precomputed)
  hard_neg_hardness: 0.5       # mutation hardness (only when text embs are not precomputed)
  # keyword groups
  keyword_subsets: 2           # positive combos sampled per image
  keyword_negs: 2              # absent single keywords used as negatives per image
  keyword_hard_negs: 1         # swapped-keyword hard negatives per image
  keyword_hard_neg_swap: 1     # keywords replaced when building a hard negative
  # regions
  mask_subdir: "masks"
  max_regions_per_image: 8
  region_template: "{}"        # must stay "{}" when keyword_emb_dir is used (regions are individual
                               # precomputed keywords, not templated sentences)
  keyword_emb_dir: "keyword_eos"  # relative to data_dir; from preprocess/precompute_keyword.py
  # augmentation (only applies when precomputed_image is false: precomputed embs are fixed)
  crop_scale: [0.5, 1.0]       # torchvision default was (0.08, 1): tiny crops break caption <-> image alignment
  hflip_prob: 0.0              # dense captions mention north/east/left/right; flipping makes them false
  row_group_cache: 4

trainer:
  accelerator: auto             # auto -> all visible CUDA devices (do NOT pin CUDA_VISIBLE_DEVICES here)
  devices: auto                 # auto -> every GPU Lightning can see, DDP across them
  max_epochs: 100
  precision:  bf16-mixed
  accumulate_grad_batches: 1
